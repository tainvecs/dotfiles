repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: zsh-syntax-check
        name: zsh syntax check
        entry: zsh -n
        language: system
        files: '\.(zsh|env)$'
        types: [file]

      - id: bats-tests
        name: bats unit tests
        entry: bats .dotfiles/test/*.bats
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
